## File: templates.yml
include:
  - project: 'iac/core-ci'
    file: '/templates/iac-base.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/templates/notify.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/includes/common-vars.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/includes/secrets.yml'
    ref: main
  
  - project: 'iac/core-ci'
    file: '/includes/tag-trigger.yml'
    ref: main

stages:
  - validate
  - security
  - test
  - deploy
  - notify
  
variables:
  TF_CLI_ARGS: "-no-color"
  TF_ROOT: "${CI_PROJECT_DIR}/applications"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  
validate:
  extends: .iac_validate
  variables:
    APP: "vault"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

security:
  extends: .iac_security
  variables:
    APP: "vault"

deploy:
  extends: .iac_deploy
  variables:
    APP: "vault"
  environment:
    name: ${ENV}
    url: https://vault-${ENV}.example.com

notify:
  extends: .notify_slack