### File: templates.yml
include:
  - project: 'iac/core-ci'
    file: '/templates/iac-base.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/templates/notify.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/includes/detect-app.yml'
    ref: main
  
  #- project: 'iac/core-ci'
  #  file: '/includes/tag-trigger.yml'
  #  ref: main

stages:
  - detect
  - validate
  - security
  - plan
  - deploy
  - notify

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^deploy-.+-.+/

variables:
  TF_ROOT: "${CI_PROJECT_DIR}/applications"
  TF_CLI_ARGS: "-no-color"
  ENV: "dev"  # Default environment for validation

detect-app:
  extends: .iac_detect_app

validate:
  extends: .iac_validate
  needs: ["detect-app"]
  variables:
    APP: "$APP"
    ENV: "$ENV"
 
security:
  extends: .iac_security
  needs: ["detect-app"] 

## Run on deploy tags
plan:
  extends: .iac_plan
 
deploy:
  extends: .iac_deploy
  needs: ["plan"]
 
notify:
  extends: .notify_slack