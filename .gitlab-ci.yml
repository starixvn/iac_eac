# File: .gitlab-ci.yml
include:
  - remote: 'https://gitlab.nexdev.net/iac/core-ci/-/raw/main/templates/iac/terraform-pipeline.yml'
  - remote: 'https://gitlab.nexdev.net/iac/core-ci/-/raw/main/templates/security/tfsec.yml'

variables:
  TF_STATE_PREFIX: "iac/${CI_ENVIRONMENT_NAME}"
  TF_CLI_ARGS: "-no-color"

stages:
  - validate
  - plan
  - apply
  - outputs

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" && $CI_COMMIT_REF_NAME =~ /^iac-/