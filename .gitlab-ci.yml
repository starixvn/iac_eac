# File: .gitlab-ci.yml
stages:
  - .pre
  - init
  - validate
  - deploy

variables:
  TF_ROOT: "${CI_PROJECT_DIR}"

#include:
#  - local: '/.gitlab/ci/core.gitlab-ci.yml'

# Job 1: Phát hiện thay đổi và tạo file env
detect_changes:
  stage: .pre
  script:
    - |
      ## Luôn tạo file, kể cả khi không có thay đổi
      mkdir -p "${CI_PROJECT_DIR}/tmp"
      CHANGE_FILE="${CI_PROJECT_DIR}/tmp/changed_vars.env"
      touch "${CHANGE_FILE}"
      
      # Chỉ kiểm tra thay đổi nếu có commit trước đó
      if [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        echo "Detecting changes between ${CI_COMMIT_BEFORE_SHA:0:8}...${CI_COMMIT_SHA:0:8}"
        mapfile -t CHANGED_FILES < <(git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA 2>/dev/null || echo "")
        
        declare -A UNIQUE_MODULES
        for file in "${CHANGED_FILES[@]}"; do
          if [[ "$file" =~ ^([^/]+)/([^/]+)/ ]]; then
            TOOL="${BASH_REMATCH[1]}"
            MODULE="${BASH_REMATCH[2]}"
            UNIQUE_MODULES["${TOOL}_${MODULE}"]=1
          fi
        done

        for module in "${!UNIQUE_MODULES[@]}"; do
          echo "${module}_CHANGED=true" >> "${CHANGE_FILE}"
        done
      fi
      
      # Di chuyển file vào thư mục artifact
      mv "${CHANGE_FILE}" "${CI_PROJECT_DIR}/"
      echo "Generated changed_vars.env:"
      cat changed_vars.env
  artifacts:
    paths:
      - changed_vars.env
    when: always  # Luôn tạo artifact dù có lỗi

# Job 2: Tạo file CI config động
generate_jobs:
  stage: .pre
  needs:
    - job: detect_changes
      artifacts: true  # Bắt buộc tải artifact
  script:
    - |
      # File: .gitlab/ci/dynamic-templates.gitlab-ci.yml (fixed)
.generate_jobs:
  stage: .pre
  needs: ["detect_changes"]
  script:
    - |
      # Tạo file YAML với fallback khi không có thay đổi
      cat > generated-jobs.yml <<'EOF'
      stages:
        - init
        - validate
        - deploy

      # Job fallback khi không có thay đổi
      no_changes:
        stage: init
        script:
          - echo "No changes detected in any module"
        rules:
          - if: '$CI_PIPELINE_SOURCE == "push"'
            when: never
          - when: on_success
      EOF

      # Đếm số module thay đổi
      CHANGED_MODULES=0

      while IFS='=' read -r var_name _; do
        if [[ "$var_name" =~ ^(.*)_CHANGED$ ]]; then
          TOOL_MODULE="${BASH_REMATCH[1]}"
          IFS='_' read -r TOOL MODULE <<< "$TOOL_MODULE"
          ((CHANGED_MODULES++))

          # Thêm jobs cho module thay đổi
          cat >> generated-jobs.yml <<EOF

      ${TOOL}_${MODULE}_init:
        extends: .init
        stage: init
        script:
          - cd "${TOOL}/${MODULE}"
          - terraform init
        variables:
          TOOL: "${TOOL}"
          MODULE: "${MODULE}"
        rules:
          - if: $${var_name}

      ${TOOL}_${MODULE}_validate:
        extends: .validate
        stage: validate
        script:
          - cd "${TOOL}/${MODULE}"
          - terraform validate
        variables:
          TOOL: "${TOOL}"
          MODULE: "${MODULE}"
        needs: ["${TOOL}_${MODULE}_init"]
        rules:
          - if: $${var_name}

      ${TOOL}_${MODULE}_deploy:
        extends: .deploy
        stage: deploy
        script:
          - cd "${TOOL}/${MODULE}"
          - terraform apply -auto-approve
        variables:
          TOOL: "${TOOL}"
          MODULE: "${MODULE}"
        needs: ["${TOOL}_${MODULE}_validate"]
        rules:
          - if: $${var_name}
      EOF
        fi
      done < changed_vars.env

      # Nếu không có module nào thay đổi, disable job fallback
      if [ $CHANGED_MODULES -gt 0 ]; then
        sed -i '/no_changes:/,/when: on_success/d' generated-jobs.yml
      fi

      echo "Generated ${CHANGED_MODULES} module jobs"
  artifacts:
    paths:
      - generated-jobs.yml
    expire_in: 1 hour

trigger_dynamic:
  stage: init
  needs:
    - job: .generate_jobs
      artifacts: true
  trigger:
    include:
      - artifact: generated-jobs.yml
        job: .generate_jobs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'