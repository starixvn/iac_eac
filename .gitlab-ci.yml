# File: .gitlab-ci.yml (fixed)
stages:
  - .pre
  - init
  - validate
  - deploy

# Job 1: Phát hiện thay đổi
detect_changes:
  stage: .pre
  script:
    - |
      touch changed_vars.env
      if [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        echo "Detecting changes..."
        mapfile -t CHANGED_FILES < <(git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA 2>/dev/null || echo "")
        
        declare -A UNIQUE_MODULES
        for file in "${CHANGED_FILES[@]}"; do
          if [[ "$file" =~ ^([^/]+)/([^/]+)/ ]]; then
            TOOL="${BASH_REMATCH[1]}"
            MODULE="${BASH_REMATCH[2]}"
            UNIQUE_MODULES["${TOOL}_${MODULE}"]=1
          fi
        done

        for module in "${!UNIQUE_MODULES[@]}"; do
          echo "${module}_CHANGED=true" >> changed_vars.env
        done
      fi
  artifacts:
    paths:
      - changed_vars.env
    when: always

# Job 2: Tạo dynamic jobs
generate_dynamic_jobs:
  stage: .pre
  needs: ["detect_changes"]  # Rõ ràng khai báo dependency
  script:
    - |
      cat > generated-jobs.yml <<'EOF'
      stages:
        - init
        - validate
        - deploy

      # Job fallback khi không có thay đổi
      no_changes:
        stage: init
        script:
          - echo "No changes detected in any module"
        rules:
          - if: '$CI_PIPELINE_SOURCE == "push"'
            when: never
          - when: on_success
      EOF

      if [ -f changed_vars.env ]; then
        while IFS='=' read -r var_name _; do
          if [[ "$var_name" =~ ^(.*)_CHANGED$ ]]; then
            TOOL_MODULE="${BASH_REMATCH[1]}"
            IFS='_' read -r TOOL MODULE <<< "$TOOL_MODULE"

            cat >> generated-jobs.yml <<EOF

      ${TOOL}_${MODULE}_init:
        extends: .init
        stage: init
        variables:
          TOOL: "${TOOL}"
          MODULE: "${MODULE}"
        script:
          - cd "${TOOL}/${MODULE}"
          - terraform init
        rules:
          - if: '\$${var_name}'

      ${TOOL}_${MODULE}_validate:
        extends: .validate
        stage: validate
        variables:
          TOOL: "${TOOL}"
          MODULE: "${MODULE}"
        script:
          - cd "${TOOL}/${MODULE}"
          - terraform validate
        needs: ["${TOOL}_${MODULE}_init"]
        rules:
          - if: '\$${var_name}'

      ${TOOL}_${MODULE}_deploy:
        stage: deploy
        script:
          - cd "${TOOL}/${MODULE}"
          - terraform apply -auto-approve
        needs: ["${TOOL}_${MODULE}_validate"]
        rules:
          - if: '\$${var_name}'
      EOF
          fi
        done < changed_vars.env
      fi
  artifacts:
    paths:
      - generated-jobs.yml

# Job 3: Trigger pipeline con
trigger_dynamic:
  stage: init
  needs:
    - job: .generate_jobs
      artifacts: true
  trigger:
    include:
      - artifact: generated-jobs.yml
        job: .generate_jobs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'