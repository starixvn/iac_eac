# File: templates.yml
stages:
  - validate
  - test
  - deploy
  - notify

include:
  - project: 'iac/core-ci'
    file: '/templates/iac-base.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/templates/notify.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/includes/common-vars.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/includes/secrets.yml'
    ref: main
  
variables:
  TF_CLI_ARGS: "-no-color"
  TF_VAR_ENVIRONMENT: $CI_ENVIRONMENT_NAME
  TF_VERSION: "1.5.7"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  
validate:
  extends: .iac_fmt
  variables:
    APP: "vault"
  script:
    - cd ${TF_ROOT}/vault
    - /.gitlab-ci/scripts/tf-helpers/validate.sh
  artifacts:
    paths:
      - ${TF_ROOT}/vault/.terraform/
    expire_in: 1 week
    #- bash scripts/tf-helpers/validate.sh $CI_PROJECT_DIR/applications/$CI_PROJECT_NAME

plan:
  extends: .iac_plan
  #needs: ["validate"]
  variables:
    APP: "vault"
  script:
    - cd ${TF_ROOT}/vault
    - /.gitlab-ci/scripts/tf-helpers/validate.sh

deploy:
  extends: .iac_apply
  #needs: ["plan"]
  variables:
    APP: "vault"

notify:
  extends: .notify_slack