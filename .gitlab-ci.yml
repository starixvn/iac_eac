# File: .gitlab-ci.yml
stages:
  - .pre
  - init
  - validate
  - deploy

variables:
  TF_ROOT: "${CI_PROJECT_DIR}"

# Job 1: Phát hiện thay đổi với cải tiến
detect_changes:
  stage: .pre
  script:
    - |
      # Luôn tạo file dù có thay đổi hay không
      mkdir -p "${CI_PROJECT_DIR}/tmp"
      CHANGE_FILE="${CI_PROJECT_DIR}/tmp/changed_vars.env"
      touch "${CHANGE_FILE}"
      
      # Sử dụng CI_MERGE_REQUEST_CHANGED_PATHS nếu có (cho Merge Request)
      if [ -n "$CI_MERGE_REQUEST_CHANGED_PATHS" ]; then
        echo "Using Merge Request changed paths..."
        mapfile -t CHANGED_FILES <<< "$CI_MERGE_REQUEST_CHANGED_PATHS"
      else
        # Fallback cho push thông thường
        if [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
          echo "Using git diff for changes..."
          mapfile -t CHANGED_FILES < <(git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA 2>/dev/null || echo "")
        fi
      fi

      declare -A UNIQUE_MODULES
      for file in "${CHANGED_FILES[@]}"; do
        if [[ "$file" =~ ^([^/]+)/([^/]+)/ ]]; then
          TOOL="${BASH_REMATCH[1]}"
          MODULE="${BASH_REMATCH[2]}"
          UNIQUE_MODULES["${TOOL}_${MODULE}"]=1
        fi
      done

      for module in "${!UNIQUE_MODULES[@]}"; do
        echo "${module}_CHANGED=true" >> "${CHANGE_FILE}"
      done
      
      # Di chuyển file vào thư mục artifact
      mv "${CHANGE_FILE}" "${CI_PROJECT_DIR}/"
      echo "Detected changes:"
      cat changed_vars.env || echo "No changes detected"
  artifacts:
    paths:
      - changed_vars.env
    when: always  # Luôn tạo artifact

# Job 2: Tạo dynamic jobs với cải tiến
generate_dynamic_jobs:
  stage: .pre
  needs: ["detect_changes"]
  script:
    - |
      # Tạo file YAML cơ bản
      cat > generated-jobs.yml <<EOF
      stages:
        - init
        - validate
        - deploy
      # Job fallback với cú pháp rules đúng
      no_changes:
        stage: init
        script:
          - echo "No changes detected in any module"
        rules:
          - if: $CI_PIPELINE_SOURCE == "push"
            when: never
          - when: on_success
      EOF
      # Đếm số module thay đổi
      CHANGED_MODULES=0
      # Thêm jobs nếu có thay đổi
      if [ -f changed_vars.env ]; then
        echo "Processing detected changes..."
        while IFS='=' read -r var_name _; do
          if [[ "$var_name" =~ ^(.*)_CHANGED$ ]]; then
            TOOL_MODULE="${BASH_REMATCH[1]}"
            IFS='_' read -r TOOL MODULE <<< "$TOOL_MODULE"
            echo "Generating jobs for ${TOOL}_${MODULE}..."
            
            cat >> generated-jobs.yml <<EOF

      ${TOOL}_${MODULE}_init:
        stage: init
        script:
          - echo "Running init for ${TOOL}/${MODULE}"
          - cd "${TOOL}/${MODULE}"
          - terraform init
        rules:
          - if: '\$${var_name} == "true"'

      ${TOOL}_${MODULE}_validate:
        stage: validate
        script:
          - echo "Running validate for ${TOOL}/${MODULE}"
          - cd "${TOOL}/${MODULE}"
          - terraform validate
        needs: ["${TOOL}_${MODULE}_init"]
        rules:
          - if: '\$${var_name} == "true"'
      EOF
          fi
        done < changed_vars.env
      else
        echo "No module changes detected."
      fi
      # Nếu không có module nào thay đổi, disable job fallback
      if [ $CHANGED_MODULES -gt 0 ]; then
        sed -i '/no_changes:/,/when: on_success/d' generated-jobs.yml
      fi
      echo "Generated jobs.yml content:"
      cat generated-jobs.yml
  artifacts:
    paths:
      - generated-jobs.yml
    expire_in: 1 hour

# Job 3: Kích hoạt pipeline con
trigger_dynamic:
  stage: init
  needs:
    - job: generate_dynamic_jobs
      artifacts: true
  trigger:
    include:
      - artifact: generated-jobs.yml
        job: generate_dynamic_jobs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'

# Include core templates
include:
  - local: '.gitlab/ci/core.gitlab-ci.yml'