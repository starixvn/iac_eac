# File: .gitlab-ci.yml
stages:
  - init
  - validate
  - deploy

variables:
  TF_ROOT: ${CI_PROJECT_DIR}

# Include các file CI cụ thể
include:
  - local: '/.gitlab/ci/core.gitlab-ci.yml'
  - local: '/.gitlab/ci/vault.gitlab-ci.yml'


# Sử dụng rules với cách viết đúng chuẩn YAML
workflow:
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /skip-ci/
      when: never
    - changes:
        - "vault/**/*"
      variables:
        TOOL: "vault"
        MODULE: "$(ls -d ${CI_PROJECT_DIR}/vault/*/ | xargs -n 1 basename | head -n 1)"
    - changes:
        - "rancher/**/*"
      variables:
        TOOL: "rancher"
        MODULE: "$(ls -d ${CI_PROJECT_DIR}/rancher/*/ | xargs -n 1 basename | head -n 1)"
    # Thêm các tool khác tương tự
    - when: always