# File: .gitlab-ci.yml (fixed)
stages:
  - detect_changes
  - pre
  - init
  - validate
  - deploy

variables:
  TF_ROOT: "${CI_PROJECT_DIR}"

# Stage 1: Dynamic detection
detect_changes:
  stage: detect_changes
  script:
    - |
      CHANGED_PATHS=$(git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA || echo "")
      echo "Detecting changes in: ${CHANGED_PATHS}"
      
      declare -A MODULE_MAP
      while IFS= read -r path; do
        if [[ "$path" =~ ^([^/]+)/([^/]+)/ ]]; then
          TOOL="${BASH_REMATCH[1]}"
          MODULE="${BASH_REMATCH[2]}"
          MODULE_MAP["${TOOL}_${MODULE}"]=1
        fi
      done <<< "$CHANGED_PATHS"
      
      for key in "${!MODULE_MAP[@]}"; do
        echo "${key}_CHANGED=true" >> changed_vars.env
      done
  artifacts:
    reports:
      dotenv: changed_vars.env

include:
  - local: '.gitlab/ci/core.gitlab-ci.yml'
  - local: '.gitlab/ci/dynamic-templates.gitlab-ci.yml'