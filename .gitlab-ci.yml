variables:
  TERRAFORM_VERSION: "1.5.7"
  TF_CLI_ARGS: "-no-color"
  TF_CLI_ARGS_init: "-input=false"
  TF_IN_AUTOMATION: "true"

stages:
  - prepare
  - init
  - validate
  - plan
  - deploy

include:
  - local: '.gitlab-ci/core-ci-templates.yml'
  - local: '.gitlab-ci/dynamic-jobs.yml'

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always