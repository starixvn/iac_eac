### File: templates.yml
include:
  - project: 'iac/core-ci'
    file: '/templates/iac-base.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/templates/notify.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/includes/detect-app.yml'
    ref: main

stages:
  - detect
  - extract
  - validate
  - security
  - plan
  - deploy
  - notify
  - cleanup

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^deploy-.+-.+/

variables:
  TF_ROOT: "${CI_PROJECT_DIR}/applications"
  TF_CLI_ARGS: "-no-color"
  TF_CLI_CONFIG_FILE: $CI_PROJECT_DIR/.terraformrc

detect-app:
  extends: .iac_detect_app

extract_tag_vars:
  extends: .extract_tag_vars

validate:
  extends: 
  - .predefined_id_tokens
  - .iac_validate
  needs: ["detect-app"]
 
security:
  extends: .iac_security
  needs: ["detect-app"] 

## Run on deploy tags
plan:
  extends: 
  - .predefined_id_tokens
  - .iac_plan
  needs: ["extract_tag_vars"]
  variables:
    APP: "$APP"  # From tag_vars.env
    ENV: "$ENV"  # From tag_vars.env
 
deploy:
  extends: .iac_deploy
  needs: ["plan"]
  variables:
    APP: "$APP"  # From tag_vars.env
    ENV: "$ENV"  # From tag_vars.env
 
notify:
  extends: .notify_slack

cleanup_tag:
  extends: .cleanup_tag