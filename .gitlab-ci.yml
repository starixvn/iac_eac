### File: templates.yml
include:
  - project: 'iac/core-ci'
    file: '/templates/iac-base.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/templates/common-base.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/includes/common-vars.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/templates/notify.yml'
    ref: main
  #- local: 'dev.gitlab-ci.yml'
  #- local: 'local.gitlab-ci.yml'

stages:
  - detect
  - extract
  - validate
  - security
  - plan
  - deploy
  - notify
  - cleanup

cache:
  - key: ${APP}-$VAULT_ENV-terraform
    paths:
      - $CI_PROJECT_DIR/.terraform
  # - key: ${APP}-$VAULT_ENV-terraform.lock.hcl
  #   paths:
  #     - $CI_PROJECT_DIR/.terraform/${APP}-$VAULT_ENV-terraform.lock.hcl

detect-app:
  extends: .detect_app

extract_tag_vars:
  extends: .extract_tag_vars
############################
validate:
  extends: 
  - .predefined_id_tokens
  - .iac_validate
  needs: ["detect-app"]
  rules:
    - changes:
        - applications/*/*
        - applications/*/*/*
 
security:
  extends: .iac_security_tf
  needs: ["detect-app","validate"] 
  rules:
    - changes:
        - applications/*/*
        - applications/*/*/*

## Run on deploy tags
plan:
  extends: 
  - .predefined_id_tokens
  - .iac_plan
  needs: ["extract_tag_vars"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy-.+-.+$/'
 
deploy:
  extends: 
  - .predefined_id_tokens
  - .iac_deploy
  needs: ["extract_tag_vars","plan"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy-.+-.+$/'
      when: manual
 
notify:
  extends: .notify_slack

cleanup_tag:
  extends: .cleanup_tag