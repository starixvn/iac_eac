### File: templates.yml
include:
  - project: 'iac/core-ci'
    file: '/templates/iac-base.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/templates/notify.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/includes/common-vars.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/includes/dynamic-vars.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/includes/secrets.yml'
    ref: main
  
  - project: 'iac/core-ci'
    file: '/includes/tag-trigger.yml'
    ref: main

stages:
  - detect
  - validate
  - security
  - plan
  - deploy
  - notify

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^deploy-.+-.+/

variables:
  TF_ROOT: "${CI_PROJECT_DIR}/applications"
  TF_CLI_ARGS: "-no-color"

