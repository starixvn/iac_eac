# File: .gitlab-ci.yml
include:
  - project: 'iac/core-ci'
    file: '/templates/iac-base.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/templates/notify.yml'
    ref: main
  
variables:
  TF_CLI_ARGS: "-no-color"
  TF_VAR_ENVIRONMENT: $CI_ENVIRONMENT_NAME

stages:
  - validate
  - plan
  - apply

.validate:
  stage: validate
  script:
    - bash .gitlab-ci/scripts/tf-helpers/validate.sh $CI_PROJECT_DIR/applications/$CI_PROJECT_NAME

.plan:
  stage: plan
  script:
    - terraform plan -var-file=environments/$CI_ENVIRONMENT_NAME/${CI_PROJECT_NAME}.tfvars -out=tfplan

.apply:
  stage: apply
  script:
    - bash .gitlab-ci/scripts/tf-helpers/deploy.sh $CI_PROJECT_NAME $CI_ENVIRONMENT_NAME