# File: .gitlab-ci.yml
stages:
  - .pre
  - init
  - validate
  - deploy

variables:
  TF_ROOT: "${CI_PROJECT_DIR}"

# Job 1: Phát hiện thay đổi và tạo file env
detect_changes:
  stage: .pre
  script:
    - |
      ## Luôn tạo file, kể cả khi không có thay đổi
      mkdir -p "${CI_PROJECT_DIR}/tmp"
      CHANGE_FILE="${CI_PROJECT_DIR}/tmp/changed_vars.env"
      touch "${CHANGE_FILE}"
      
      # Chỉ kiểm tra thay đổi nếu có commit trước đó
      if [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        echo "Detecting changes between ${CI_COMMIT_BEFORE_SHA:0:8}...${CI_COMMIT_SHA:0:8}"
        mapfile -t CHANGED_FILES < <(git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA 2>/dev/null || echo "")
        
        declare -A UNIQUE_MODULES
        for file in "${CHANGED_FILES[@]}"; do
          if [[ "$file" =~ ^([^/]+)/([^/]+)/ ]]; then
            TOOL="${BASH_REMATCH[1]}"
            MODULE="${BASH_REMATCH[2]}"
            UNIQUE_MODULES["${TOOL}_${MODULE}"]=1
          fi
        done

        for module in "${!UNIQUE_MODULES[@]}"; do
          echo "${module}_CHANGED=true" >> "${CHANGE_FILE}"
        done
      fi
      
      # Di chuyển file vào thư mục artifact
      mv "${CHANGE_FILE}" "${CI_PROJECT_DIR}/"
      echo "Generated changed_vars.env:"
      cat changed_vars.env
  artifacts:
    paths:
      - changed_vars.env
    when: always  # Luôn tạo artifact dù có lỗi

# Job 2: Tạo file CI config động
generate_jobs:
  stage: .pre
  needs:
    - job: detect_changes
      artifacts: true  # Bắt buộc tải artifact
  script:
    - |
      # Tạo file YAML với format đúng
      {
        echo "stages:"
        echo "  - init"
        echo "  - validate"
        echo "  - deploy"
        echo ""
        
        while IFS='=' read -r var_name _; do
          if [[ "$var_name" =~ ^(.*)_CHANGED$ ]]; then
            TOOL_MODULE="${BASH_REMATCH[1]}"
            IFS='_' read -r TOOL MODULE <<< "$TOOL_MODULE"
            
            echo "${TOOL}_${MODULE}_init:"
            echo "  extends: .init"
            echo "  stage: init"
            echo "  variables:"
            echo "    TOOL: \"${TOOL}\""
            echo "    MODULE: \"${MODULE}\""
            echo "  rules:"
            echo "    - if: \$vault_starix_CHANGED == \"true\""
            echo ""
            
            echo "${TOOL}_${MODULE}_validate:"
            echo "  extends: .validate"
            echo "  stage: validate"
            echo "  variables:"
            echo "    TOOL: \"${TOOL}\""
            echo "    MODULE: \"${MODULE}\""
            echo "  needs: [\"${TOOL}_${MODULE}_init\"]"
            echo "  rules:"
            echo "    - if: \$vault_starix_CHANGED == \"true\""
            echo ""
            
            echo "${TOOL}_${MODULE}_deploy:"
            echo "  extends: .deploy"
            echo "  stage: deploy"
            echo "  variables:"
            echo "    TOOL: \"${TOOL}\""
            echo "    MODULE: \"${MODULE}\""
            echo "  needs: [\"${TOOL}_${MODULE}_validate\"]"
            echo "  rules:"
            echo "    - if: \$vault_starix_CHANGED == \"true\""
            echo ""
          fi
        done < changed_vars.env
      } > generated-jobs.yml
      
      # Verify YAML syntax
      yamllint generated-jobs.yml || exit 1
      echo "Generated jobs file:"
      cat generated-jobs.yml
  artifacts:
    paths:
      - generated-jobs.yml
    expire_in: 1 hour

# Job 3: Kích hoạt pipeline con
trigger_dynamic:
  stage: init
  needs:
    - job: generate_jobs
      artifacts: true
  trigger:
    include:
      - artifact: generated-jobs.yml
        job: "generate_jobs"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'