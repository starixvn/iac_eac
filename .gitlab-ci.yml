# File: .gitlab-ci.yml
stages:
  - init
  - validate
  - deploy

variables:
  TF_ROOT: ${CI_PROJECT_DIR}

# Include các file CI cụ thể
include:
  - local: '/.gitlab/ci/core.gitlab-ci.yml'
  - local: '/.gitlab/ci/vault.gitlab-ci.yml'


# Sử dụng rules để extract module từ path
workflow:
  rules:
    - changes:
        - "vault/**/*"
      variables:
        TOOL: "vault"
        MODULE: "$(echo ${CI_PROJECT_DIR}/vault/* | sed 's|.*/vault/\([^/]*\).*|\1|')"
    - changes:
        - "rancher/**/*"
      variables:
        TOOL: "rancher"
        MODULE: "$(echo ${CI_PROJECT_DIR}/rancher/* | sed 's|.*/rancher/\([^/]*\).*|\1|')"
    # Thêm các tool khác tương tự