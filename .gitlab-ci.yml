---
include:
  - project: 'iac/core-ci'
    file: '/templates/common-base.gitlab-ci.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/iac-base.gitlab-ci.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/includes/common-vars.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/includes/notify.yml'
    ref: dev

stages:
  - .pre
  - init
  - validate
  - security
  - plan
  - deploy
  - notify
  - cleanup

# Job 2: Generate dynamic jobs
generate_dynamic_jobs:
  stage: .pre
  extends: [".generate_dynamic_jobs"]
  needs: ["detect_changes"]

# Job 3: Kích hoạt pipeline con
trigger_dynamic:
  stage: init
  needs:
    - job: generate_dynamic_jobs
      artifacts: true
  trigger:
    include:
      - artifact: generated-jobs.yml
        job: generate_dynamic_jobs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'

## Run on deploy tags
plan:
  extends: 
  - .predefined_id_tokens
  - .iac_plan_tag
  needs: ["extract_tag_vars"]
 
deploy:
  extends: 
  - .predefined_id_tokens
  - .iac_deploy_tag
  needs: ["extract_tag_vars","plan"]
 
notify:
  extends: .notify_slack

cleanup_tag:
  extends: .cleanup_tag