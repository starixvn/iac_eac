# File: .gitlab-ci.yml (fixed)
stages:
  - .pre
  - init
  - validate
  - deploy

variables:
  TF_ROOT: "${CI_PROJECT_DIR}"

# Job phát hiện thay đổi LUÔN chạy đầu tiên
detect_changes:
  stage: .pre
  script:
    - |
      echo "Detecting changes between $CI_COMMIT_BEFORE_SHA and $CI_COMMIT_SHA"
      mapfile -t CHANGED_FILES < <(git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA || echo "")
      
      declare -A UNIQUE_MODULES
      for file in "${CHANGED_FILES[@]}"; do
        if [[ "$file" =~ ^([^/]+)/([^/]+)/ ]]; then
          TOOL="${BASH_REMATCH[1]}"
          MODULE="${BASH_REMATCH[2]}"
          UNIQUE_MODULES["${TOOL}_${MODULE}"]=1
        fi
      done

      for module in "${!UNIQUE_MODULES[@]}"; do
        echo "${module}_CHANGED=true" >> changed_vars.env
        echo "Detected changes in: $module"
      done
  artifacts:
    reports:
      dotenv: changed_vars.env

include:
  - local: '.gitlab/ci/core.gitlab-ci.yml'
  - local: '.gitlab/ci/dynamic-templates.gitlab-ci.yml'