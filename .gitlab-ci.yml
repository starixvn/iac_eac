# Run on code changes
validate:
  extends: .iac_validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      for app in $(ls applications); do
        APP=$app
        echo "$app"
        terraform validate
        terraform fmt -check -recursive
      done

security:
  extends: .iac_security
  needs: ["validate"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Run on deploy tags
plan:
  extends: .iac_plan
  rules:
    - if: $CI_COMMIT_TAG =~ /^deploy-(.+)-(.+)$/
  variables:
    APP: "${CI_COMMIT_TAG#deploy-}"
    ENV: "${CI_COMMIT_TAG##*-}"

deploy:
  extends: .iac_deploy
  needs: ["plan"]
  rules:
    - if: $CI_COMMIT_TAG =~ /^deploy-(.+)-(.+)$/
      when: manual
  variables:
    APP: "${CI_COMMIT_TAG#deploy-}"
    ENV: "${CI_COMMIT_TAG##*-}"

notify:
  extends: .notify_slack