# File: templates.yml
image:
  name: $DOCKER_REG_LOCAL_URL/base/hashicorp/terraform:1.4.5-vault
  entrypoint:
      - "/usr/bin/env"
      - "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
stages:
  - validate
  - plan
  - deploy
  - notify

include:
  - project: 'iac/core-ci'
    file: '/templates/iac-base.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/templates/notify.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/includes/common-vars.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/includes/secrets.yml'
    ref: main
  
variables:
  TF_CLI_ARGS: "-no-color"
  TF_VAR_ENVIRONMENT: $CI_ENVIRONMENT_NAME
  TF_VERSION: "1.5.7"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  
validate:
  extends: .iac_validate
  #stage: validate
  script:
    - cd $CI_PROJECT_DIR/applications/$CI_PROJECT_NAME
    - bash scripts/tf-helpers/validate.sh $CI_PROJECT_DIR/applications/$CI_PROJECT_NAME

# .plan:
#   stage: plan
#   script:
#     - terraform plan -var-file=environments/$CI_ENVIRONMENT_NAME/${CI_PROJECT_NAME}.tfvars -out=tfplan

deploy:
  extends: .iac_deploy
  script:
    - cd $CI_PROJECT_DIR/applications/$CI_PROJECT_NAME
    - bash scripts/tf-helpers/deploy.sh $CI_PROJECT_NAME $CI_ENVIRONMENT_NAME
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

notify-failure:
  extends: .notify_slack