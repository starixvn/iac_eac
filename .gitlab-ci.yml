# File: .gi# Include các file CI cụ thể
#include:
#  - local: '/.gitlab/ci/core.gitlab-ci.yml'

stages:
  - .pre
  - init
  - validate
  - deploy

# Job 1: Phát hiện thay đổi
detect_changes:
  stage: .pre
  script:
    - |
      touch changed_vars.env
      if [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        echo "Detecting changes..."
        mapfile -t CHANGED_FILES < <(git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA 2>/dev/null || echo "")
        
        declare -A UNIQUE_MODULES
        for file in "${CHANGED_FILES[@]}"; do
          if [[ "$file" =~ ^([^/]+)/([^/]+)/ ]]; then
            TOOL="${BASH_REMATCH[1]}"
            MODULE="${BASH_REMATCH[2]}"
            UNIQUE_MODULES["${TOOL}_${MODULE}"]=1
          fi
        done

        for module in "${!UNIQUE_MODULES[@]}"; do
          echo "${module}_CHANGED=true" >> changed_vars.env
        done
      fi
  artifacts:
    paths:
      - changed_vars.env
    when: always

# Job 2: Tạo dynamic jobs
generate_dynamic_jobs:
  stage: .pre
  needs: ["detect_changes"]  # Rõ ràng khai báo dependency
  script:
    - |
      cat > generated-jobs.yml <<'EOF'
      stages:
        - init
        - validate
        - deploy

      # Job fallback khi không có thay đổi
      no_changes:
        stage: init
        script:
          - echo "No changes detected in any module"
        rules:
          - if: '$CI_PIPELINE_SOURCE == "push"'
            when: never
          - when: on_success
      EOF

      # Đếm số module thay đổi
      CHANGED_MODULES=0

      while IFS='=' read -r var_name _; do
        if [[ "$var_name" =~ ^(.*)_CHANGED$ ]]; then
          TOOL_MODULE="${BASH_REMATCH[1]}"
          IFS='_' read -r TOOL MODULE <<< "$TOOL_MODULE"
          ((CHANGED_MODULES++))

          # Thêm jobs cho module thay đổi
          cat >> generated-jobs.yml <<EOF

      ${TOOL}_${MODULE}_init:
        extends: .init
        stage: init
        script:
          - cd "${TOOL}/${MODULE}"
          - terraform init
        variables:
          TOOL: "${TOOL}"
          MODULE: "${MODULE}"
        rules:
          - if: '\$${var_name}'

      ${TOOL}_${MODULE}_validate:
        extends: .validate
        stage: validate
        script:
          - cd "${TOOL}/${MODULE}"
          - terraform validate
        variables:
          TOOL: "${TOOL}"
          MODULE: "${MODULE}"
        needs: ["${TOOL}_${MODULE}_init"]
        rules:
          - if: '\$${var_name}'

      ${TOOL}_${MODULE}_deploy:
        extends: .deploy
        stage: deploy
        script:
          - cd "${TOOL}/${MODULE}"
          - terraform apply -auto-approve
        variables:
          TOOL: "${TOOL}"
          MODULE: "${MODULE}"
        needs: ["${TOOL}_${MODULE}_validate"]
        rules:
          # Đếm số module thay đổi
      CHANGED_MODULES=0

      while IFS='=' read -r var_name _; do
        if [[ "$var_name" =~ ^(.*)_CHANGED$ ]]; then
          TOOL_MODULE="${BASH_REMATCH[1]}"
          IFS='_' read -r TOOL MODULE <<< "$TOOL_MODULE"
          ((CHANGED_MODULES++))

          # Thêm jobs cho module thay đổi
          cat >> generated-jobs.yml <<EOF

      ${TOOL}_${MODULE}_init:
        extends: .init
        stage: init
        script:
          - cd "${TOOL}/${MODULE}"
          - terraform init
        variables:
          TOOL: "${TOOL}"
          MODULE: "${MODULE}"
        rules:
          - if: '\$${var_name}'

      ${TOOL}_${MODULE}_validate:
        extends: .validate
        stage: validate
        script:
          - cd "${TOOL}/${MODULE}"
          - terraform validate
        variables:
          TOOL: "${TOOL}"
          MODULE: "${MODULE}"
        needs: ["${TOOL}_${MODULE}_init"]
        rules:
          - if: '\$${var_name}'

      ${TOOL}_${MODULE}_deploy:
        extends: .deploy
        stage: deploy
        script:
          - cd "${TOOL}/${MODULE}"
          - terraform apply -auto-approve
        variables:
          TOOL: "${TOOL}"
          MODULE: "${MODULE}"
        needs: ["${TOOL}_${MODULE}_validate"]
        rules:
          - if: '\$${var_name}'
      EOF
        fi
      done < changed_vars.env

      # Nếu không có module nào thay đổi, disable job fallback
      if [ $CHANGED_MODULES -gt 0 ]; then
        sed -i '/no_changes:/,/when: on_success/d' generated-jobs.yml
      fi

      echo "Generated ${CHANGED_MODULES} module jobs"
      EOF
        fi
      done < changed_vars.env

      # Nếu không có module nào thay đổi, disable job fallback
      if [ $CHANGED_MODULES -gt 0 ]; then
        sed -i '/no_changes:/,/when: on_success/d' generated-jobs.yml
      fi

      echo "Generated ${CHANGED_MODULES} module jobs"
  artifacts:
    paths:
      - generated-jobs.yml
    expire_in: 1 hour

# Job 3: Trigger pipeline con
trigger_dynamic:
  stage: init
  needs: ["generate_dynamic_jobs"]  # Rõ ràng khai báo dependency
  trigger:
    include:
      - artifact: generated-jobs.yml
        job: generate_dynamic_jobs
      - local: '/.gitlab/ci/core.gitlab-ci.yml'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'