### File: templates.yml
include:
  - project: 'iac/core-ci'
    file: '/templates/iac-base.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/templates/common-base.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/includes/common-vars.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/templates/notify.yml'
    ref: main

stages:
  - detect
  - extract
  - validate
  - security
  - plan
  - deploy
  - notify
  - cleanup

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^deploy-.+-.+/

cache:
  - key: ${APP}-$VAULT_ENV-terraform
    paths:
      - $CI_PROJECT_DIR/.terraform
  # - key: ${APP}-$VAULT_ENV-terraform.lock.hcl
  #   paths:
  #     - $CI_PROJECT_DIR/.terraform/${APP}-$VAULT_ENV-terraform.lock.hcl

detect-app:
  extends: .detect_app

extract_tag_vars:
  extends: .extract_tag_vars

validate:
  extends: 
  - .predefined_id_tokens
  - .iac_validate
  needs: ["detect-app"]
 
security:
  extends: .iac_security
  needs: ["detect-app","validate"] 

## Run on deploy tags
plan:
  extends: 
  - .predefined_id_tokens
  - .iac_plan
  needs: ["extract_tag_vars"]
 
deploy:
  extends: 
  - .predefined_id_tokens
  - .iac_deploy
  needs: ["extract_tag_vars","plan"]
 
notify:
  extends: .notify_slack

cleanup_tag:
  extends: .cleanup_tag