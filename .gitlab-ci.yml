### File: templates.yml
include:
  - project: 'iac/core-ci'
    file: '/templates/iac-base.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/templates/notify.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/includes/common-vars.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/includes/dynamic-vars.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/includes/secrets.yml'
    ref: main
  
  - project: 'iac/core-ci'
    file: '/includes/tag-trigger.yml'
    ref: main

stages:
  - detect
  - validate
  - security
  - plan
  - deploy
  - notify

variables:
  TF_ROOT: "${CI_PROJECT_DIR}/applications"
  TF_CLI_ARGS: "-no-color"

detect-changes:
  stage: detect
  image: alpine:latest
  script:
    - apk add --no-cache git bash
    - source <(echo "$DETECT_CHANGES_SCRIPT")
    - export APP=$(detect_changed_app)
    - echo "Detected APP ${APP}"
    - echo "APP=${APP}" > app.env
  artifacts:
    reports:
      dotenv: app.env
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

validate:
  extends: .iac_validate
  needs: ["detect-changes"]
  variables:
    APP: "$APP"  # Inherited from detect-changes
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

plan:
  extends: .iac_init
  stage: plan
  needs: ["validate"]
  script:
    - |
      cd applications/${APP}
      terraform plan -var-file="environments/${ENV:-dev}/${APP}.tfvars" -out=tfplan
      terraform show -json tfplan > tfplan.json
  artifacts:
    paths:
      - applications/${APP}/tfplan
      - applications/${APP}/tfplan.json
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

security:
  extends: .iac_security
  needs: ["validate"]
  variables:
    APP: "$APP"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:
  extends: .iac_deploy
  stage: deploy
  needs: ["plan"]
  script:
    - |
      cd applications/${APP}
      terraform apply tfplan
  rules:
    - if: $CI_COMMIT_TAG =~ $DEPLOY_TAG_PATTERN
      when: manual

notify:
  extends: .notify_slack