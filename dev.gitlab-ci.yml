# === DEV ENVIRONMENT ===
detect-app-dev:
  extends: .detect_env
  variables:
    ENV: dev
    VAULT_ADDR: https://vault-dev.nexdev.net
  rules:
    - changes:
        - environments/dev/*/*
        - environments/dev/*/*/*
    - when: never

validate-dev:
  extends: 
  - .predefined_id_tokens
  - .iac_validate
  needs: ["detect-app-dev"]
  rules:
    - changes:
        - environments/dev/*/*
        - environments/dev/*/*/*
    - when: never
 
security-dev:
  extends: .iac_security_tf
  needs: ["detect-app-dev","validate-dev"]
  rules:
    - changes:
        - environments/dev/*/*
        - environments/dev/*/*/*
    - when: never

plan-dev:
  extends: 
  - .predefined_id_tokens
  - .iac_plan
  needs: ["detect-app-dev","validate-dev","security-dev"]
  rules:
    - changes:
        - environments/dev/*/*
        - environments/dev/*/*/*
    - when: never
 
deploy-dev:
  extends: 
  - .predefined_id_tokens
  - .iac_deploy
  needs: ["detect-app-dev","plan-dev"]
  rules:
    - changes:
        - environments/dev/*/*
        - environments/dev/*/*/*
      when: manual
    - when: never
