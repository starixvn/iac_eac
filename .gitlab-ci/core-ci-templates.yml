.tf_init_template: &tf_init
  stage: init
  image:
    name: $DOCKER_REG_LOCAL_URL/base/hashicorp/terraform:1.4.5-vault
    entrypoint: [""]
  script:
    - cd ${TF_ROOT}
    - terraform init -backend=false
  artifacts:
    paths:
      - ${TF_ROOT}/.terraform/
    expire_in: 1 hour

.tf_validate_template: &tf_validate
  stage: validate
  image:
    name: $DOCKER_REG_LOCAL_URL/base/hashicorp/terraform:1.4.5-vault
    entrypoint: [""]
  script:
    - cd ${TF_ROOT}
    - terraform validate
  needs: ["init_${TF_ROOT}"]

.tf_plan_template: &tf_plan
  stage: plan
  image:
    name: $DOCKER_REG_LOCAL_URL/base/hashicorp/terraform:1.4.5-vault
    entrypoint: [""]
  script:
    - cd ${TF_ROOT}
    - terraform plan -var-file=${TF_VARS_FILE} -input=false -out=tfplan
  artifacts:
    paths:
      - ${TF_ROOT}/tfplan
    expire_in: 1 week
  needs: ["validate_${TF_ROOT}"]

.tf_apply_template: &tf_apply
  stage: deploy
  image:
    name: $DOCKER_REG_LOCAL_URL/base/hashicorp/terraform:1.4.5-vault
    entrypoint: [""]
  script:
    - cd ${TF_ROOT}
    - terraform apply -input=false tfplan
  dependencies:
    - "plan_${TF_ROOT}"
  when: manual