generate_jobs:
  stage: prepare
  image: hub.nexdev.net/base/alpine:git-3.21
  script:
    - |
      find -maxdepth 4 -mindepth 4 -type d -path '*/variable.d/*' | while read -r dir; do
        tool=$(echo "$dir" | cut -d'/' -f2)
        module=$(echo "$dir" | cut -d'/' -f3)
        org=$(echo "$dir" | cut -d'/' -f5)
        # Generate init/validate jobs for all modules
        cat <<EOF > ".gitlab-ci/jobs/${tool}_${module}_base.yml"
        init_${tool}_${module}:
          extends: .tf_init_template
          variables:
            TF_ROOT: "${tool}/${module}"
          rules:
            - if: \$CI_COMMIT_BRANCH == "main"
              changes:
                - "${tool}/${module}/**/*"
              when: always
        validate_${tool}_${module}:
          extends: .tf_validate_template
          variables:
            TF_ROOT: "${tool}/${module}"
          rules:
            - if: \$CI_COMMIT_BRANCH == "main"
              changes:
                - "${tool}/${module}/**/*"
              when: always
        EOF
      done
  artifacts:
    paths:
      - .gitlab-ci/jobs/*.yml
    expire_in: 1 hour

include:
  - local: '.gitlab-ci/jobs/*.yml'