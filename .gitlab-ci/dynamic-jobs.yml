generate_jobs:
  stage: prepare
  image: hub.nexdev.net/base/alpine:git-3.21
  script:
    - |
      find -maxdepth 4 -mindepth 4 -type d -path '*/variable.d/*' | while read -r dir; do
        tool=$(echo "$dir" | cut -d'/' -f2)
        module=$(echo "$dir" | cut -d'/' -f3)
        org=$(echo "$dir" | cut -d'/' -f5)
        echo "$tool $module $org"
      done
  artifacts:
    paths:
      - .gitlab-ci/jobs/*.yml
    expire_in: 1 hour

include:
  - local: '.gitlab-ci/jobs/*.yml'