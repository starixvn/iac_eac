# File: .gitlab/ci/tool_vault.gitlab-ci.yml
variables:
  TOOL: "vault"

# Jobs cho môi trường local
vault_local_init:
  extends: .init
  variables:
    ENV: "local"
    ORG: "lumi"
    MODULE: "$(echo ${CI_PROJECT_DIR}/vault/* | xargs -n 1 basename)"
  rules:
    - changes:
        - "vault/*/variable.d/lumi/local/*"
      when: on_success
    - when: never

vault_local_validate:
  extends: .validate
  variables:
    ENV: "local"
    ORG: "lumi"
    MODULE: "$(echo ${CI_PROJECT_DIR}/vault/* | xargs -n 1 basename)"
  rules:
    - changes:
        - "vault/*/variable.d/lumi/local/*"
      when: on_success
    - when: never

vault_local_deploy:
  extends: .deploy
  variables:
    ENV: "local"
    ORG: "lumi"
  rules:
    - changes:
        - "vault/**/variable.d/${ORG}/local/*"
      when: manual

# Tương tự cho các môi trường khác (uat, prod)
vault_uat_init:
  extends: .init
  variables:
    ENV: "uat"
    ORG: "lumi"
  rules:
    - changes:
        - "vault/**/variable.d/${ORG}/uat/*"
      when: on_success

# Jobs khi thay đổi không phải trong env
vault_common_validate:
  extends: .validate
  variables:
    ENV: "none"
  rules:
    - changes:
        - "vault/**/*"
        - "!vault/**/variable.d/**/*"
      when: on_success