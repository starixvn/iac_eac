# Job tạo dynamic pipeline
generate_jobs:
  stage: .pre
  needs: ["detect_changes"]  # Rõ ràng phụ thuộc vào job detect
  script:
    - |
      cat > generated-jobs.yml <<EOF
      stages:
        - init
        - validate
        - deploy
      EOF

      while IFS='=' read -r var_name _; do
        if [[ "$var_name" == *_CHANGED ]]; then
          TOOL_MODULE="${var_name%_CHANGED}"
          IFS='_' read -r TOOL MODULE <<< "$TOOL_MODULE"
          
          cat >> generated-jobs.yml <<EOF

      ${TOOL}_${MODULE}_init:
        extends: .init
        stage: init
        variables:
          TOOL: "$TOOL"
          MODULE: "$MODULE"
        rules:
          - if: '\$$var_name' == 'true'

      ${TOOL}_${MODULE}_validate:
        extends: .validate
        stage: validate
        variables:
          TOOL: "$TOOL"
          MODULE: "$MODULE"
        needs: ["${TOOL}_${MODULE}_init"]
        rules:
          - if: '\$$var_name' == 'true'

      ${TOOL}_${MODULE}_deploy:
        extends: .deploy
        stage: deploy
        variables:
          TOOL: "$TOOL"
          MODULE: "$MODULE"
        needs: ["${TOOL}_${MODULE}_validate"]
        rules:
          - if: '\$$var_name' == 'true'
      EOF
        fi
      done < changed_vars.env
  artifacts:
    paths:
      - generated-jobs.yml
    expire_in: 1 hour

# Trigger dynamic pipeline
trigger_dynamic:
  stage: init
  needs: ["generate_jobs"]  # Rõ ràng phụ thuộc vào generate_jobs
  trigger:
    include:
      - artifact: generated-jobs.yml
        job: "generate_jobs"